name: Chromium UI checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Playwright Chromium
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start Next.js frontend
        run: |
          pnpm --filter @aegisphish-lab/frontend dev -- --hostname 127.0.0.1 > /tmp/aegisphish-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/aegisphish-frontend.log
          exit 1
      - name: Run Chromium checks
        run: python -m pytest -q tests/browser
        env:
          AEGISPHISH_BASE_URL: http://127.0.0.1:3000
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aegisphish-browser-diagnostics
          path: /tmp/aegisphish-frontend.log
          if-no-files-found: ignore
